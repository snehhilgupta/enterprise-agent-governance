[project]
name = "enterprise-agent-governance"
version = "0.1.0"
description = "Policy enforcement and audit layer for multi-agent pipelines"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["governance"]